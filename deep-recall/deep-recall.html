<style>
/* Layout: instrument-panel shell. Phone: one column with a bottom tab bar. Desktop (≥1040px): fixed left rail + 760px content column.
   Dark-first: graphite surfaces, hairline structure, one cool signal accent, mono for data, serif for long reading. */
:root{
  --bg:#0A0C10; --bg-2:#0E1117; --surface:#12151C; --surface-2:#181C25; --raise:#1D222D;
  --line:#232936; --line-2:#2F3747;
  --ink:#E7EAF0; --ink-2:#A7AFBD; --ink-3:#6E7687;
  --accent:#6CCFE6; --accent-2:#3FB3CF; --accent-ink:#051218; --accent-soft:rgba(108,207,230,.10); --accent-line:rgba(108,207,230,.35);
  --good:#5BCB98; --good-soft:rgba(91,203,152,.11); --warn:#E2B45C; --warn-soft:rgba(226,180,92,.11); --bad:#EE7B7B; --bad-soft:rgba(238,123,123,.11);
  --s1:#E8A06A; --s2:#8FD694; --s3:#B79CF2; --shade:rgba(108,207,230,.14);
  --scrim:rgba(4,6,9,.72); --glow:0 0 0 1px var(--accent-line), 0 0 24px -6px rgba(108,207,230,.35);
  --f-ui:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read:"Newsreader", Georgia, "Times New Roman", serif;
  --f-mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:10px; --r-sm:7px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F2F3F6; --bg-2:#ECEEF2; --surface:#FFFFFF; --surface-2:#F6F7F9; --raise:#FFFFFF;
    --line:#E2E5EB; --line-2:#CFD4DD;
    --ink:#0D1015; --ink-2:#4A5262; --ink-3:#7B8394;
    --accent:#0A7C98; --accent-2:#086A82; --accent-ink:#FFFFFF; --accent-soft:rgba(10,124,152,.08); --accent-line:rgba(10,124,152,.35);
    --good:#177A4E; --good-soft:rgba(23,122,78,.08); --warn:#9A6400; --warn-soft:rgba(154,100,0,.09); --bad:#B8323A; --bad-soft:rgba(184,50,58,.08);
    --s1:#C2560C; --s2:#2F7D3A; --s3:#7445C9; --shade:rgba(10,124,152,.12);
    --scrim:rgba(12,16,24,.38); --glow:0 0 0 1px var(--accent-line), 0 6px 20px -10px rgba(10,124,152,.4);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F2F3F6; --bg-2:#ECEEF2; --surface:#FFFFFF; --surface-2:#F6F7F9; --raise:#FFFFFF;
  --line:#E2E5EB; --line-2:#CFD4DD;
  --ink:#0D1015; --ink-2:#4A5262; --ink-3:#7B8394;
  --accent:#0A7C98; --accent-2:#086A82; --accent-ink:#FFFFFF; --accent-soft:rgba(10,124,152,.08); --accent-line:rgba(10,124,152,.35);
  --good:#177A4E; --good-soft:rgba(23,122,78,.08); --warn:#9A6400; --warn-soft:rgba(154,100,0,.09); --bad:#B8323A; --bad-soft:rgba(184,50,58,.08);
  --s1:#C2560C; --s2:#2F7D3A; --s3:#7445C9; --shade:rgba(10,124,152,.12);
  --scrim:rgba(12,16,24,.38); --glow:0 0 0 1px var(--accent-line), 0 6px 20px -10px rgba(10,124,152,.4);
  color-scheme:light;
}

/* ---- base */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:8px 56px}
body.has-nav #app{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-ui);font-weight:600;text-wrap:balance;letter-spacing:-.02em;margin:0;line-height:1.15}
p{margin:0}
a{color:var(--accent)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.mono-t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative}
.hud{position:relative}
.hud::before,.hud::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--accent);border-style:solid;opacity:.8;pointer-events:none}
.hud::before{top:-1px;left:-1px;border-width:1.5px 0 0 1.5px;border-top-left-radius:var(--r)}
.hud::after{bottom:-1px;right:-1px;border-width:0 1.5px 1.5px 0;border-bottom-right-radius:var(--r)}
.section{margin-top:30px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 12px}
.section-h h2{font-size:1.02rem;font-weight:600;letter-spacing:-.01em;flex:none}
.section-h .eyebrow{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ---- buttons */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:var(--r-sm);padding:9px 15px;font-weight:550;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;transition:border-color .15s, background .15s, box-shadow .15s, transform .06s;text-align:center;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2);box-shadow:var(--glow)}
.btn.go{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);border-color:var(--line)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13.5px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.on-color{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn.on-color.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink-2);width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--line)}
.icon-btn:disabled{opacity:.35}
.linkish{appearance:none;background:none;border:0;padding:0;color:var(--accent);font-weight:550;cursor:pointer;text-decoration:underline;text-decoration-color:var(--accent-line);text-underline-offset:3px;font-size:inherit;text-align:left}
.linkish.small{font-size:13px}

/* ---- notices, chips */
.notice{border-radius:var(--r-sm);padding:10px 13px;background:var(--surface-2);color:var(--ink-2);font-size:14px;margin-top:10px;border:1px solid var(--line)}
.notice.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.notice.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.notice.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{appearance:none;border:1px solid var(--line-2);background:transparent;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip-btn:hover:not(:disabled){border-color:var(--accent-line);color:var(--ink)}
.chip-btn:disabled{opacity:.4;cursor:not-allowed}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.skill b{font-weight:550;color:var(--ink)}
.tag{font-family:var(--f-mono);font-style:normal;font-size:.62em;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:.2em .5em;border-radius:4px;vertical-align:.18em;white-space:nowrap;border:1px solid currentColor}
.tag-established{color:var(--good)} .tag-inferred{color:var(--accent)} .tag-contested{color:var(--warn)} .tag-speculative{color:var(--bad)}
.gap-chip{font-size:12.5px;border:1px solid var(--warn);color:var(--warn);border-radius:99px;padding:2px 9px}
.pill{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:99px;padding:3px 8px;color:var(--ink-2);white-space:nowrap}
.pill.accent{border-color:var(--accent-line);color:var(--accent)}
.pill.good{border-color:var(--good);color:var(--good)}
.pill.warn{border-color:var(--warn);color:var(--warn)}

/* ---- progress primitives */
.bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .5s ease}
.bar.thin{height:3px}
.bar.goal i{background:var(--good)}
.ticks{display:grid;grid-template-columns:repeat(var(--n,10),1fr);gap:3px}
.ticks i{height:6px;border-radius:2px;background:var(--line)}
.ticks i.on{background:var(--accent)}
.ticks i.half{background:var(--accent-line)}
.ring{--p:0;--c2:var(--accent);width:var(--sz,54px);height:var(--sz,54px);border-radius:50%;background:conic-gradient(var(--c2) calc(var(--p)*1%), var(--line) 0);display:grid;place-items:center;flex:none}
.ring>span{width:calc(100% - 6px);height:calc(100% - 6px);border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.ring.big{--sz:112px}
.ring.big>span{width:calc(100% - 8px);height:calc(100% - 8px);font-size:20px;font-weight:500}
.metric{display:flex;flex-direction:column;gap:3px;min-width:0}
.metric b{font-family:var(--f-mono);font-size:1.28rem;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.metric span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.metrics{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.metrics .metric{background:var(--surface);padding:12px 14px;flex:1 1 96px}
.metrics.m4 .metric{flex-basis:72px}

/* ---- nav: bottom bar on phones, left rail on desktop */
#nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
#nav[hidden]{display:none!important}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav-brand{display:none}
.nav-b{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;cursor:pointer;color:var(--ink-3);font-size:10px;font-family:var(--f-mono);letter-spacing:.05em;text-transform:uppercase;position:relative}
.nav-b.on{color:var(--accent)}
.nav-b.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
.nav-b .badge{position:absolute;top:4px;left:calc(50% + 7px);background:var(--warn);color:var(--accent-ink);font-size:9.5px;font-family:var(--f-mono);border-radius:99px;padding:0 5px;line-height:1.5;letter-spacing:0}
.nav-b .badge.blue{background:var(--accent)}
@media (min-width:1040px){
  body.has-nav #app{padding-bottom:56px}
  body.has-nav{padding-left:232px}
  #nav{top:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);background:var(--bg-2);padding:22px 14px}
  .nav-in{display:flex;flex-direction:column;gap:2px;max-width:none}
  .nav-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 24px;font-weight:600;letter-spacing:-.01em}
  .nav-b{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:var(--r-sm);font-size:11.5px}
  .nav-b:hover{background:var(--surface)}
  .nav-b.on{background:var(--accent-soft)}
  .nav-b.on::before{top:8px;bottom:8px;left:0;right:auto;width:2px;height:auto;border-radius:0 2px 2px 0}
  .nav-b .badge{position:static;margin-left:auto}
}
.brand-mark{font-family:var(--f-mono);font-size:11px;font-weight:500;border:1px solid var(--accent-line);color:var(--accent);border-radius:6px;width:30px;height:30px;display:grid;place-items:center;letter-spacing:.02em;background:var(--accent-soft)}

/* ---- page scaffolding */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem;letter-spacing:-.01em}
@media (min-width:1040px){ .topbar .brand{visibility:hidden} }
.stats{display:flex;gap:6px}
.stat{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 8px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stat.fire svg{color:var(--warn)} .stat.xp svg{color:var(--accent)}
.subbar{display:flex;align-items:center;gap:6px;padding-block:8px;position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5;margin-inline:-16px;padding-inline:10px 16px;border-bottom:1px solid transparent}
.subbar-t{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.crumbs b{color:var(--ink-2);font-weight:500}
.page-h{padding-block:14px 4px}
.page-h h1{font-size:1.9rem}
.page-h p{margin-top:8px;max-width:60ch}
.boot{padding-block:32vh 0;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--ink-3);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}

/* ---- today */
.hero{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.hero h1{font-size:1.5rem}
.hero .sub{color:var(--ink-2);margin-top:4px;font-size:14px}
.hero-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.hero-stats span{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.hero-stats b{color:var(--ink);font-weight:500}
.plan{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.plan-item{appearance:none;display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%}
.plan-item:last-child{border-bottom:0}
.plan-item:hover{background:var(--surface-2)}
.plan-item .pi-ic{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink-2)}
.plan-item.primary .pi-ic{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.plan-item b{display:block;font-weight:550;font-size:14.5px;line-height:1.3}
.plan-item small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.plan-item .pi-t{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:92px;margin-top:12px}
.week7 div{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.week7 i{display:block;width:100%;max-width:30px;border-radius:3px 3px 1px 1px;background:var(--accent);min-height:2px;opacity:.9}
.week7 i.zero{background:var(--line);opacity:1}
.week7 i.today{box-shadow:0 0 0 1px var(--accent), 0 0 12px -2px var(--accent)}
.week7 span{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.delta{font-family:var(--f-mono);font-size:12px}
.delta.up{color:var(--good)} .delta.down{color:var(--ink-3)}

/* ---- library */
.lib{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.lib-row{appearance:none;display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%}
.lib-row:last-child{border-bottom:0}
.lib-row:hover{background:var(--surface-2)}
.lib-row .t{min-width:0;display:flex;flex-direction:column}
.lib-row .ln{font-weight:550;font-size:15px;line-height:1.3}
.lib-row:disabled{opacity:.5;cursor:not-allowed}
.lib-row .lr svg{color:var(--ink-3)}
.lib-row .lm{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);margin-top:3px}
.lib-row .lr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lib-row .lr .bar{width:72px}
.mono{font-family:var(--f-mono);font-weight:500;font-size:12px;color:color-mix(in srgb, var(--c, var(--ink-2)) 72%, var(--ink));border:1px solid color-mix(in srgb, var(--c, var(--ink-3)) 55%, transparent);background:color-mix(in srgb, var(--c, var(--ink-3)) 12%, transparent);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;flex:none;letter-spacing:.03em}
.lib-add{border-style:dashed}
.lib-add .mono{border-style:dashed;background:transparent;color:var(--ink-3)}

/* ---- subject dashboard */
.subj-top{padding-top:6px}
.subj-top h1{font-size:2rem;margin-top:6px}
.subj-top p.blurb{color:var(--ink-2);margin-top:6px;max-width:60ch}
.levelcard{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.lv-num{font-family:var(--f-mono);font-size:2.6rem;font-weight:500;line-height:1;color:var(--accent);letter-spacing:-.04em}
.lv-name{font-size:1.15rem;font-weight:600}
.lv-meta{font-size:13px;color:var(--ink-2);margin-top:3px}
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:22px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);background:var(--bg);z-index:4}
.tabbar button{appearance:none;border:0;background:none;padding:11px 14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar button.on{color:var(--ink);border-bottom-color:var(--accent)}
.nextcard{margin-top:16px;display:flex;gap:14px;align-items:center}
.nextcard .t{flex:1;min-width:0}
.nextcard b{display:block;font-size:15.5px;margin-top:3px;line-height:1.3}
.nextcard small{color:var(--ink-3);font-size:12.5px}
.nextcard small.bad-t{color:var(--warn)}
.courses{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.course{appearance:none;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;color:inherit;font:inherit}
.course:hover{border-color:var(--line-2)}
.course.open{border-color:var(--accent-line)}
.course .ci{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.course b{font-size:15px;font-weight:550}
.course .meta{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.course .cp{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.course .bar{grid-column:1/-1;margin-top:-2px}
.course>span:nth-child(2){min-width:0}
.course-acts{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px 20px}
.path{display:flex;flex-direction:column;margin:8px 0 14px;border-left:1px solid var(--line);margin-left:19px}
.prow{appearance:none;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:none;border:0;padding:9px 8px 9px 0;text-align:left;cursor:pointer;border-radius:var(--r-sm);color:inherit;font:inherit;position:relative}
.prow:hover .ptitle{color:var(--accent)}
.node{position:relative;margin-left:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.node>span{font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3)}
.node.st1{border-color:var(--ink-3)} .node.st2{border-color:var(--accent-line)} .node.st3{border-color:var(--accent);background:var(--accent-soft)} .node.st4{border-color:var(--accent);background:var(--accent)}
.node.st4>span{color:var(--accent-ink)}
.node .dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.ptext{display:flex;flex-direction:column;gap:2px;min-width:0}
.ptitle{font-weight:500;font-size:14.5px;line-height:1.3;transition:color .15s}
.pmeta{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pmeta .g{color:var(--warn)}
.pstage{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.pstage.s3,.pstage.s4{color:var(--accent)}
.unit{margin-top:22px}
.unit-h h3{font-size:1.05rem;margin-top:4px}
.stage-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.stage-legend span{display:inline-flex;align-items:center;gap:6px}
.stage-legend .node{margin:0;width:12px;height:12px}
.mrow{display:grid;grid-template-columns:minmax(0,170px) 1fr 44px;gap:12px;align-items:center;padding:7px 0;font-size:14px}
.mrow .bar i{background:var(--c, var(--accent))}
.mrow .v{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.mrow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- topic page */
.topic-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;padding-top:8px}
.topic-head h1{font-size:1.75rem;margin-top:6px;overflow-wrap:anywhere;hyphens:auto}
.stagebar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px}
.stagebar div{display:flex;flex-direction:column;gap:6px}
.stagebar i{height:4px;border-radius:2px;background:var(--line)}
.stagebar .on i{background:var(--accent)}
.stagebar span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stagebar .on span{color:var(--ink-2)}
.stagebar .cur span{color:var(--accent)}
.method-sw{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:2px;gap:2px;background:var(--surface)}
.method-sw button{appearance:none;border:0;background:none;padding:6px 10px;border-radius:5px;font-size:12.5px;cursor:pointer;color:var(--ink-2);font-weight:500}
.method-sw button.on{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.flow{display:flex;flex-direction:column;margin-top:10px;counter-reset:f}
.fstep{appearance:none;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.fstep:first-child{border-top:0}
.fstep:disabled{cursor:default}
.fstep .fi{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.fstep.done .fi{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.fstep.next .fi{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.fstep b{display:block;font-weight:550;font-size:14.5px}
.fstep small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px}
.fstep.skip b,.fstep.lock b{color:var(--ink-3)}
.fstep .go{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.fstep.next .go{color:var(--accent)}
.fstep:hover:not(:disabled) b{color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px}
.kv div{background:var(--surface);padding:10px 12px;min-width:0}
.kv span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font-family:var(--f-mono);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.gap-line{font-size:14px;padding-left:14px;position:relative}
.gap-line::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--warn)}

/* ---- learn in bits */
.bitticks{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;margin:6px 0 14px}
.bitticks button{appearance:none;border:0;height:6px;border-radius:2px;background:var(--line);cursor:pointer;padding:0}
.bitticks button.ok{background:var(--good)}
.bitticks button.meh{background:var(--warn)}
.bitticks button.cur{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bitmeta{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.bitcheck{margin-top:18px}
.bitqa{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.bitqa .msg.ai .prose{font-size:1rem}

/* ---- knowledge points */
.kpcard summary{cursor:pointer;list-style:none}
.kpcard summary::-webkit-details-marker{display:none}
.kplist{display:flex;flex-direction:column;margin-top:10px;border-left:1px solid var(--line);margin-left:11px}
.kprow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:7px 0}
.kprow .node{width:20px;height:20px}
.kprow .ptitle{font-size:14px}

/* ---- modal */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .15s ease;backdrop-filter:blur(3px)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:26px 24px;z-index:41;animation:pop .2s ease;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.levelup{box-shadow:var(--glow)}
.lu-level{font-family:var(--f-mono);font-size:3.6rem;line-height:1;color:var(--accent);letter-spacing:-.04em;margin:6px 0 2px}
.levelup h2{font-size:1.5rem}
.levelup .btn{margin-top:10px;min-width:160px}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---- lesson prose */
.prose{font-family:var(--f-read);font-size:1.13rem;line-height:1.68;color:var(--ink);max-width:66ch;overflow-wrap:break-word}
.prose h1{font-family:var(--f-ui);font-size:2rem;line-height:1.1;margin:.5em 0 .35em;letter-spacing:-.03em}
.prose h1 + p{font-size:1.14em;color:var(--ink-2);font-style:italic}
.prose h2{font-family:var(--f-ui);font-size:1.3rem;margin:1.8em 0 .4em;padding-top:.9em;border-top:1px solid var(--line)}
.prose h3{font-family:var(--f-ui);font-size:1.08rem;margin:1.3em 0 .3em}
.prose h4{font-family:var(--f-ui);font-size:1rem;margin:1.1em 0 .3em}
.prose p{margin:.75em 0}
.prose ul,.prose ol{padding-left:1.3em;margin:.6em 0}
.prose li{margin:.35em 0}
.prose li::marker{color:var(--ink-3)}
.prose strong{font-weight:600;color:var(--ink)}
.prose code{font-family:var(--f-mono);font-size:.8em;background:var(--surface-2);border:1px solid var(--line);padding:.08em .35em;border-radius:4px}
.prose pre{overflow-x:auto;background:var(--surface-2);border:1px solid var(--line);padding:12px 14px;border-radius:var(--r-sm);font-size:.82em}
.prose pre code{background:none;border:0;padding:0}
.prose blockquote{border-left:2px solid var(--accent-line);margin:1em 0;padding-left:1em;color:var(--ink-2)}
.prose .tbl{overflow-x:auto;margin:1em 0}
.prose table{border-collapse:collapse;font-size:.88em;font-family:var(--f-ui)}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.prose th{font-weight:600;font-family:var(--f-mono);font-size:.8em;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.prose.sm{font-size:1rem}
.prose > :first-child{margin-top:0}
.math-display{overflow-x:auto;overflow-y:hidden;margin:1em 0}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%}
.check{font-family:var(--f-ui);font-size:15px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;margin:1.4em 0;display:flex;flex-direction:column;gap:10px}
.check .q{font-weight:550;font-size:15.5px;line-height:1.4}
.check textarea{width:100%;min-height:78px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface);resize:vertical;font-family:var(--f-read);font-size:1rem}
.check .ans{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--f-read);font-size:1.02rem}
.check .rated{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.skel{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.skel i{display:block;height:12px;border-radius:4px;background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:0 0}}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13.5px;margin-top:14px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pl 1.2s ease-in-out infinite;flex:none}
@keyframes pl{0%,100%{opacity:.25}50%{opacity:1}}
.weblog{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:4px;margin-top:12px}
.weblog span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stream-bar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:99px;padding:5px 5px 5px 14px;margin-top:20px;width:max-content;max-width:100%;font-size:13px;color:var(--ink-2)}
.lesson-next{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.lesson-next h3{font-size:1.15rem;margin-top:4px}
.lesson-next p{color:var(--ink-2);max-width:58ch;font-size:14.5px}
.tutor{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.tutor-form{display:flex;gap:8px;align-items:flex-end}
.tutor-form textarea{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2);resize:vertical;min-height:44px;font-size:15px}
.meta-line{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-top:16px;letter-spacing:.04em}

/* ---- tutor */
.tview{display:flex;flex-direction:column;min-height:calc(100vh - 20px)}
.ctx-strip{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
.ctx{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--ink-3);background:transparent}
.ctx.on{border-color:var(--accent-line);color:var(--accent)}
.ctx-b{cursor:pointer}
.ctx-b:hover{border-color:var(--line-2);color:var(--ink-2)}
.notes{margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.tintro{padding:6px 0 10px;display:flex;flex-direction:column;gap:12px}
.tintro p{max-width:58ch;color:var(--ink-2)}
#tlog{display:flex;flex-direction:column;gap:16px}
.msg.user{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px 12px 3px 12px;padding:9px 13px;max-width:85%;font-size:14.5px;white-space:pre-wrap;overflow-wrap:break-word}
.msg.ai{border-left:1.5px solid var(--accent-line);padding-left:14px;min-width:0}
.msg.ai .prose{font-size:1.03rem}
.msg .err{color:var(--bad);font-size:13px;margin-top:4px}
.msg .status{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);margin-top:6px}
.actcard{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-sm);padding:9px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:10px;font-family:var(--f-ui);font-size:13.5px}
.msg.ai.wrap{border-left-color:var(--accent);background:var(--accent-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:10px 14px}
.tierline{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);margin-top:8px;text-transform:uppercase}
.tierline.warn{color:var(--warn)}
.reccard{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-family:var(--f-ui);font-size:12.5px;color:var(--good)}
.reccard span{color:var(--ink-2)}
.reccard svg{flex:none;margin-top:2px}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.quick .chip-btn{flex:none;background:var(--surface)}
.composer{position:sticky;bottom:0;background:linear-gradient(to bottom, transparent, var(--bg) 18%);padding-block:18px calc(12px + env(safe-area-inset-bottom,0px));margin-top:auto;display:flex;flex-direction:column;gap:8px}
.composer-row{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:var(--r);padding:11px 13px;background:var(--surface);resize:none;min-height:46px;max-height:180px;font-size:15px}
.composer textarea:focus{border-color:var(--accent-line);outline:none;box-shadow:var(--glow)}
.attach-chip{align-self:flex-start;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 10px;display:flex;gap:6px;align-items:center}

/* ---- sessions */
.sess-top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:10px;z-index:5}
.sess-top .bar{flex:1;height:4px}
.sess-top .bar i{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.sess-count{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.sess-load{padding-block:40px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sess-load h1{font-size:1.7rem}
.sess-load p{max-width:54ch}
.qwrap{padding-block:14px 0;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.diff{display:inline-flex;gap:3px;align-items:center}
.diff i{width:12px;height:3px;border-radius:2px;background:var(--line-2)}
.diff i.on{background:var(--accent)}
.q-prompt{font-size:1.2rem;line-height:1.5}
.q-prompt p{margin:.3em 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:13px 14px;cursor:pointer;font-size:15px;line-height:1.45;color:inherit;font-family:inherit;transition:border-color .15s, background .15s}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt-k{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-radius:5px;width:24px;height:24px;display:grid;place-items:center;flex:none;color:var(--ink-3)}
.opt.sel .opt-k{border-color:var(--accent);color:var(--accent)}
.opt.ok .opt-k{border-color:var(--good);color:var(--good)}
.opt.no .opt-k{border-color:var(--bad);color:var(--bad)}
.answer{width:100%;min-height:150px;border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;background:var(--surface);font-family:var(--f-read);font-size:1.07rem;line-height:1.55;resize:vertical}
.answer:focus,.pinput:focus,.field:focus{border-color:var(--accent-line);outline:none;box-shadow:var(--glow)}
.answer.tall{min-height:240px}
.answer.short{min-height:80px}
.pinput{width:100%;font-family:var(--f-mono);font-size:16px;border:1px solid var(--line-2);border-radius:var(--r);padding:13px 14px;background:var(--surface)}
.pinput[readonly]{background:var(--surface-2);color:var(--ink-2)}
.pprev{min-height:32px;padding:2px;color:var(--ink);overflow-x:auto;font-size:1.08rem}
.pprev .lbl{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);margin-right:8px;text-transform:uppercase;letter-spacing:.12em}
.hint{font-size:12.5px;color:var(--ink-3)}
.tries{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.conf{display:flex;flex-direction:column;gap:7px}
.conf-b{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cf{appearance:none;border:1px solid var(--line-2);background:transparent;border-radius:var(--r-sm);padding:8px 4px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--ink-2)}
.cf:hover{border-color:var(--ink-3)}
.cf.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.kstate{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:4px;padding:2px 6px;color:var(--ink-3)}
.kstate.ok{color:var(--good);border-color:var(--good)} .kstate.warn{color:var(--warn);border-color:var(--warn)} .kstate.bad{color:var(--bad);border-color:var(--bad)}
.order-picked{border:1px dashed var(--line-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:70px}
.order-picked .empty{color:var(--ink-3);font-size:14px;padding:12px}
.oi{appearance:none;display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:10px 12px;cursor:pointer;font-size:14.5px;line-height:1.4;color:inherit;font-family:inherit}
.oi b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;color:var(--ink-3);min-width:18px;padding-top:2px}
.oi:disabled{cursor:default}
.pool{display:flex;flex-direction:column;gap:8px}
.fb{border-radius:var(--r);padding:14px 16px;border:1px solid;display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--good-soft);border-color:color-mix(in srgb, var(--good) 45%, transparent)}
.fb.warn{background:var(--warn-soft);border-color:color-mix(in srgb, var(--warn) 45%, transparent)}
.fb.bad{background:var(--bad-soft);border-color:color-mix(in srgb, var(--bad) 45%, transparent)}
.fb-h{font-weight:600;font-size:1.08rem;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fb.good .fb-h{color:var(--good)} .fb.warn .fb-h{color:var(--warn)} .fb.bad .fb-h{color:var(--bad)}
.fb-score{font-family:var(--f-mono);font-size:12px;font-weight:400}
.fb p{font-size:14.5px}
.fb details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.fb summary{cursor:pointer;font-weight:550;font-size:13.5px}
.fb details .prose{margin-top:6px}
.hyper{border-left:2px solid var(--warn);padding:4px 0 4px 10px}
.root{font-size:13px;color:var(--ink-2);margin-top:3px}
.rubric{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.rubric li{display:flex;gap:8px}
.rubric .m{font-family:var(--f-mono);font-weight:500;flex:none;width:16px}
.rubric .y{color:var(--good)} .rubric .n{color:var(--bad)}
.fb-gaps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.photo-fb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sess-actions{position:sticky;bottom:0;background:linear-gradient(to bottom, transparent, var(--bg) 28%);padding-block:22px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.sess-actions .btn{flex:1 1 120px;max-width:240px}
.intro-lesson{margin-top:10px}
.summary{padding-block:28px 10px;display:flex;flex-direction:column;gap:18px}
.summary .pct{font-family:var(--f-mono);font-size:3.6rem;font-weight:500;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.sum-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sum-stats div{background:var(--surface);padding:11px 13px}
.sum-stats span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.sum-stats b{font-family:var(--f-mono);font-size:1.25rem;font-weight:500;font-variant-numeric:tabular-nums}
.change{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.change:last-child{border-bottom:0}
.change .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.change .up{color:var(--good)} .change .down{color:var(--bad)}

.answer.code{font-family:var(--f-mono);font-size:13.5px;line-height:1.55;min-height:220px;tab-size:4;white-space:pre}
.code-out{font-family:var(--f-mono);font-size:12.5px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:0;white-space:pre-wrap;max-height:220px;overflow:auto;color:var(--ink-2)}
.code-out.bad{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 40%, transparent)}
.given{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.exam-clock{font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid var(--accent-line);border-radius:99px;padding:2px 8px}
.exam-clock.low{color:var(--bad);border-color:var(--bad)}

/* ---- review, gaps, you */
.review-hero{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:12px}
.review-hero .big{font-family:var(--f-mono);font-size:2.4rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .mono{width:32px;height:32px;font-size:11px;border-radius:7px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:550;font-size:14.5px;line-height:1.25}
.li .t span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.week div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 4px;text-align:center}
.week span{display:block;font-size:10px;color:var(--ink-3);font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.week b{font-family:var(--f-mono);font-size:1.05rem;font-weight:500;font-variant-numeric:tabular-nums}
.week .z b{color:var(--ink-3)}
.gap-group{display:flex;flex-direction:column;gap:10px}
.gap-group-h{display:flex;gap:12px;align-items:center}
.gap-group-h .t{flex:1;min-width:0}
.gap-group-h .t b{display:block;font-size:15px;line-height:1.25;font-weight:550}
.gap-group-h .t span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.gap-item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)}
.gap-item .t{flex:1;min-width:0}
.gap-item b{font-size:14.5px;display:block;font-weight:550}
.gap-item p{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.gap-item .hits{font-family:var(--f-mono);font-size:11px;color:var(--warn);white-space:nowrap}
.gap-item.resolved b{text-decoration:line-through;color:var(--ink-3)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:9px 13px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 150px;color:inherit;font:inherit}
.seg button b{font-size:14px;font-weight:550}
.seg button span{font-size:12px;color:var(--ink-3)}
.seg button.on{border-color:var(--accent);background:var(--accent-soft)}
.seg.compact button{flex:0 1 auto;align-items:center}
.kpis{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.kpis div{background:var(--surface);padding:12px 14px;flex:1 1 110px}
.kpis span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kpis b{font-family:var(--f-mono);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:5px;height:96px;margin-top:12px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 1px 1px;min-height:2px}
.bars i.zero{background:var(--line)}
.bars span{font-size:9.5px;color:var(--ink-3);font-family:var(--f-mono)}
.calrow{display:grid;grid-template-columns:minmax(0,130px) 1fr 70px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.calrow .n em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.calrow .v{font-family:var(--f-mono);font-size:11.5px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.calbar{position:relative;height:8px;background:var(--line);border-radius:99px}
.calbar .actual{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.calbar .stated{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px);z-index:1}
.field{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 13px;background:var(--surface);font-size:15px}
select.field{appearance:auto}
.empty-state{padding:22px 18px;color:var(--ink-2)}
.empty-state b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px;font-weight:600}
.confirm{border:1px solid color-mix(in srgb, var(--bad) 50%, transparent);background:var(--bad-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.rungs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;counter-reset:r}
.rungs li{counter-increment:r;display:grid;grid-template-columns:30px 1fr;column-gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rungs li:last-child{border-bottom:0}
.rungs li::before{content:counter(r);grid-row:span 3;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.rungs li.done::before{content:"✓";border-color:var(--good);color:var(--good)}
.rungs li.now::before{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.rungs li b{font-weight:550}
.rungs li span{color:var(--ink-2);font-size:13px}
.rungs li em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.rungs li:not(.now):not(.done) b{color:var(--ink-2)}
.plan-d summary{cursor:pointer;font-size:14px;font-weight:550}
.more{margin-top:16px;display:flex;flex-direction:column;gap:8px}

/* ---- tasks, sources */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;border:0;border-bottom:2px solid transparent;background:none;padding:9px 12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--ink-3);margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.choice-card{appearance:none;text-align:left;width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit}
.choice-card:hover:not(:disabled){border-color:var(--accent-line)}
.choice-card.on{border-color:var(--accent);background:var(--accent-soft)}
.choice-card:disabled{opacity:.45;cursor:not-allowed}
.choice-card b{font-weight:600}
.choice-card span{color:var(--ink-2);font-size:14px}
.source-text{max-height:420px;overflow-y:auto;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.qpair textarea{margin:0}

/* ---- graphs */
.plot{margin:1em 0;min-height:40px}
.plot-fig{margin:0;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 10px;font-family:var(--f-ui)}
.plot-fig svg{display:block;width:100%;height:auto;max-width:100%}
.plot-fig figcaption{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 6px 0;font-size:12px;color:var(--ink-2)}
.plot-fig figcaption b{width:100%;color:var(--ink)}
.pg{stroke:var(--line);stroke-width:1}
.pa{stroke:var(--ink-3);stroke-width:1.2}
.pt{fill:var(--ink-3);font-size:10.5px;font-family:var(--f-mono)}
.pt2{fill:var(--ink-2);font-size:12px;font-family:var(--f-ui)}
.pl{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.pc0{stroke:var(--accent)} .pc1{stroke:var(--s1)} .pc2{stroke:var(--s2)} .pc3{stroke:var(--s3)}
.ph0{fill:var(--accent)} .ph1{fill:var(--s1)} .ph2{fill:var(--s2)} .ph3{fill:var(--s3)}
.ps{stroke:none;fill:var(--shade)}
.pv{stroke-width:2.2}
.pr{stroke:var(--ink-3);stroke-width:1.1;stroke-dasharray:5 4}
.pp{fill:var(--ink);stroke:var(--bg-2);stroke-width:2}
.pf{stroke:var(--ink-3);stroke-width:1;opacity:.7}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:14px;height:2px;border-radius:2px}
.lgc0{background:var(--accent)} .lgc1{background:var(--s1)} .lgc2{background:var(--s2)} .lgc3{background:var(--s3)}
.lgs0,.lgs1,.lgs2,.lgs3{background:var(--shade);height:10px!important}

/* ---- languages */
.say{display:inline;white-space:normal}
.say-b{appearance:none;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0 3px;vertical-align:-3px;border-radius:5px}
.say-b:hover{background:var(--accent-soft)}
.say-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.say-big{appearance:none;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:var(--r);min-width:54px;height:54px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.blank{display:inline-block;min-width:3em;border-bottom:1.5px solid var(--accent);color:transparent}
.charbar{display:flex;flex-wrap:wrap;gap:5px}
.tok{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:7px 12px;font-size:15px;cursor:pointer;color:var(--ink);font-family:inherit}
.tok:hover:not(:disabled){border-color:var(--ink-3)}
.tok:disabled{cursor:default;opacity:.8}
.tok.on{border-color:var(--accent);background:var(--accent-soft)}
.build-line{display:flex;flex-wrap:wrap;gap:6px;min-height:56px;padding:10px;border:1px dashed var(--line-2);border-radius:var(--r);align-items:center}
.build-pool{display:flex;flex-wrap:wrap;gap:6px}

.reader .rs{margin:.55em 0;line-height:1.7}
.reader .tr{display:block;color:var(--ink-3);font-family:var(--f-ui);font-size:.8em;margin-top:2px}
.reader .linkish{margin-left:6px;font-family:var(--f-ui)}

/* ---- projects */
.steps{list-style:none;margin:14px 0;padding:0;display:flex;flex-wrap:wrap;gap:5px;counter-reset:s}
.steps li{counter-increment:s;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 4px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:10px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.steps li.done{color:var(--good);border-color:color-mix(in srgb, var(--good) 45%, transparent)}
.steps li.done::before{content:"✓";color:var(--good)}
.steps li.now{color:var(--ink);border-color:var(--accent-line)}
.steps li.now::before{background:var(--accent);color:var(--accent-ink)}
.steps li b{font-weight:500}
.step-card h3{font-size:1.2rem}
.checkpoint{border-top:1px dashed var(--line-2);padding-top:12px;display:flex;flex-direction:column;gap:10px}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);color:var(--ink);border:1px solid var(--line-2);padding:9px 15px;border-radius:var(--r-sm);font-size:13.5px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
@media (min-width:1040px){ #toast{bottom:28px;margin-left:116px} }
@media (max-width:420px){
  .kv{grid-template-columns:1fr 1fr}
  .prose{font-size:1.06rem}
  .q-prompt{font-size:1.12rem}
  .mrow{grid-template-columns:minmax(0,110px) 1fr 40px}
  .calrow{grid-template-columns:minmax(0,96px) 1fr 62px}
  .hero{gap:14px;align-items:start}
  .topic-head .ring.big{--sz:84px}
  .topic-head .ring.big>span{font-size:16px}
  .topic-head h1{font-size:1.45rem}
  .hero .ring.big{--sz:76px}
  .hero .ring.big>span{font-size:16px}
  .hero h1{font-size:1.25rem}
  .conf-b{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* ================================================================ v15: dashboard, library tiles, progress, toolkit */
:root{--sg0:var(--line);--sg1:color-mix(in srgb,var(--accent) 28%,var(--surface));--sg2:color-mix(in srgb,var(--accent) 52%,var(--surface));--sg3:color-mix(in srgb,var(--accent) 78%,var(--surface));--sg4:var(--accent)}
.sg0{background:var(--sg0)} .sg1{background:var(--sg1)} .sg2{background:var(--sg2)} .sg3{background:var(--sg3)} .sg4{background:var(--sg4)}
.ring.sm{--sz:34px} .ring.sm>span{width:calc(100% - 5px);height:calc(100% - 5px);font-size:10.5px}
.ring.mid{--sz:58px} .ring.mid>span{font-size:13px}
.stile .ring{--c2:var(--c,var(--accent))}

/* top bar tier chip */
.tierchip{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--accent);border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer;font:inherit;font-size:12.5px}
.tierchip span{color:var(--ink);font-weight:550}
.tierchip:hover{border-color:var(--accent-line)}

/* Today */
.continue{margin-top:10px;padding:20px}
.continue h1{font-size:1.4rem;margin-top:6px}
.continue .sub{color:var(--ink-2);margin-top:6px;font-size:14px;max-width:60ch}
.continue .btn svg{margin-right:2px}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.qtile{appearance:none;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;color:inherit;font:inherit;min-width:0}
.qtile svg{color:var(--accent)}
.qtile b{font-size:13.5px;font-weight:550}
.qtile .qv{grid-column:1/-1;font-family:var(--f-mono);font-size:1.3rem;margin-top:6px;font-variant-numeric:tabular-nums}
.qtile .qs{grid-column:1/-1;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtile:hover{border-color:var(--line-2);background:var(--surface-2)}
@media (max-width:560px){ .qgrid{grid-template-columns:repeat(2,1fr)} }
.todaycard{margin-top:10px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.mini7{display:flex;gap:5px;align-items:flex-end;height:52px}
.mini7 div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.mini7 i{display:block;width:8px;border-radius:3px 3px 0 0;background:var(--accent)}
.mini7 i.zero{background:var(--line)} .mini7 i.today{outline:1px solid var(--accent-line);outline-offset:1px}
.mini7 span{font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3)}
@media (max-width:480px){ .todaycard{grid-template-columns:auto 1fr} .mini7{grid-column:1/-1;justify-content:space-between;height:44px} .mini7 i{width:14px} }

/* subject tiles */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
@media (max-width:480px){ .sgrid{grid-template-columns:1fr 1fr;gap:8px} }
.stile{appearance:none;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;color:inherit;font:inherit;min-width:0;position:relative}
.stile:hover{background:var(--surface-2);border-color:var(--line-2);border-top-color:var(--c,var(--accent))}
.stile.fresh{border-top-color:color-mix(in srgb,var(--c) 45%,var(--line))}

function speak(text, lang, slow) {
  try {
    const ss = window.speechSynthesis; if (!ss) { toast('This device can’t play speech.'); return; }
    ss.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = lang || 'en-US'; u.rate = slow ? 0.7 : 0.95;
    const v = voiceFor(lang); if (v) u.voice = v;
    else if (lang && !voiceFor(lang)) toast('No ' + lang + ' voice on this device; using the default voice.');
    ss.speak(u);
  } catch (e) { toast('Speech isn’t available here.'); }
}
function voiceFor(lang) {
  try {
    const vs = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
    const l = String(lang || '').toLowerCase(), base = l.split('-')[0];
    return vs.find(v => v.lang && v.lang.toLowerCase() === l) || vs.find(v => v.lang && v.lang.toLowerCase().split(/[-_]/)[0] === base) || null;
  } catch (e) { return null; }

  spec.hlines.forEach(h => { g += `<line class="pr" x1="${L}" y1="${sy(h.y)}" x2="${W - R}" y2="${sy(h.y)}"/>${h.label ? `<text class="pt2" x="${W - R - 4}" y="${sy(h.y) - 5}" text-anchor="end">${esc(h.label)}</text>` : ''}`; });

  });
  spec.points.forEach(p => { if (p.x < x0 || p.x > x1 || p.y < y0 || p.y > y1) return; g += `<circle class="pp" cx="${sx(p.x)}" cy="${sy(p.y)}" r="4.5"/>${p.label ? `<text class="pt2" x="${sx(p.x) + 7}" y="${sy(p.y) - 7}">${esc(p.label)}</text>` : ''}`; });
  if (spec.xlabel) gA += `<text class="pt" x="${W - R}" y="${H - 4}" text-anchor="end">${esc(spec.xlabel)}</text>`;
  if (spec.ylabel) gA += `<text class="pt" x="${L + 4}" y="${T + 10}">${esc(spec.ylabel)}</text>`;
  const legend = series.map(s => `<span class="lg"><i class="lgc${s.i % 4}"></i>${esc(s.label)}</span>`).join('') + spec.shade.map((s, i) => s.label ? `<span class="lg"><i class="lgs${i % 4}"></i>${esc(s.label)}</span>` : '').join('');

function drawPlots(root) {

const WEB = {
  state:'off', msg:'', mcp:null, desc:{},
  async init(ask) {
    this.msg = '';
    if (!window.claude || typeof window.claude.use !== 'function') { this.state = 'unavailable'; this.msg = 'Web search needs this page to be open inside Claude.'; return; }
    if (!AI.tools) { this.state = 'unavailable'; this.msg = 'This Claude view can’t give Claude tools, so web search is off here.'; return; }
    let mcp = null;
    try { mcp = await window.claude.use('mcp'); } catch (e) { mcp = null; }
    if (!mcp) { this.state = 'unavailable'; this.msg = 'Connector access isn’t available in this view.'; return; }
    let perms = null;
    try { perms = await window.claude.use('permissions'); } catch (e) { perms = null; }
    const name = 'mcp:' + WEB_SERVER;
    let st = 'prompt';
    if (perms) { try { st = await perms.state(name); } catch (e) { st = 'prompt'; } }
    if (st === 'denied') { this.state = 'denied'; this.msg = 'Web search was declined for this page. Allow it from the page’s permissions menu.'; return; }
    if (st !== 'granted') {
      if (!ask) { this.state = 'off'; return; }
      if (perms) {
        let r = {};

        const s2 = r[name];

      }

      const d = {};
      for (const t of ['web_search', 'web_fetch']) {
        try { d[t] = await mcp.describeTool(WEB_SERVER, t); }
        catch (e) { if (t === 'web_search') throw e; }

      this.desc = d; this.mcp = mcp; this.state = 'ready';
    } catch (e) {
      this.state = 'unavailable';
      const c = e && e.code;
      this.msg = c === 'server_not_connected' ? `Add the free “${WEB_SERVER}” connector in claude.ai Settings → Connectors, then reload this page.`
        : c === 'needs_reauth' ? `Reconnect “${WEB_SERVER}” in claude.ai Settings → Connectors.`
        : c === 'selection_required' ? `You have more than one “${WEB_SERVER}” connector. Choose one when the page asks, then reload.`
        : c === 'not_in_manifest' ? 'Web search isn’t allowed for this page right now.'
        : c === 'blocked_by_policy' ? 'Your organization’s policy blocks this connector.'
        : 'Couldn’t reach the web search connector. Try again in a moment.';

  /* Parallel Search returns {results:[{url,title,publish_date,excerpts[]}]}; keep what Claude needs, capped */
  compact(payload) {
    if (payload && typeof payload === 'object' && Array.isArray(payload.results)) {
      return JSON.stringify(payload.results.slice(0, 10).map(r => ({
        url:r.url, title:r.title, published:r.publish_date || undefined,
        excerpts:(Array.isArray(r.excerpts) ? r.excerpts : [r.excerpts || r.content || '']).map(x => String(x || '').slice(0, 1800)).slice(0, 3)
      })));

  },
  tools(onUse) {

    const out = [];

      if (!schema || typeof schema !== 'object' || schema.type !== 'object') continue;

        name, description:(str(d.description) || name).slice(0, 900), inputSchema:schema,
        execute: async (input, ctx) => {

            const c = e && e.code;

const FW = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];

function kpRecall(x, now) { return x && x.s ? fsrsR(((now || Date.now()) - x.l) / DAY, x.s) : 0; }

function implicitCredit(key) {

/* ---- calibration + meta-skill cards (You page; calibration also per subject) */
function calCardHtml(sid) {
  const c = calStats(sid), where = sid ? 'in this subject' : '';

  const verdict = c.over > 0.05 ? `<b>Overconfident by ${Math.round(c.over * 100)} points</b>: you feel surer than your results justify.` : c.over < -0.05 ? `<b>Underconfident by ${Math.round(-c.over * 100)} points</b>: you know more than you think.` : '<b>Well calibrated</b>: confidence matches accuracy.';
  return head + `<section class="card">

}

  if (!fb.doubt) h += fb.reported ? '<p class="small muted">Reported. This problem no longer counts toward your stats or gaps.</p>' : `<div><button class="linkish small" data-act="reportProblem">This problem is broken. Don’t count it.</button></div>`;

}

function renderPreview() {

  const changes = X.changes.slice().sort((a, b) => (b.after - b.before) - (a.after - a.before)).map(c => { const i = nodeInfo(c.k); const d = c.after - c.before; return i ? `<div class="change"><span>${esc(i.title)}</span><span class="v">${c.before}% → ${c.after}% <span class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d}</span></span></div>` : ''; }).join('');

/* ---- charts: single hue, thin marks, recessive axes, hover titles */
function colChart(data, o) {

  return `<div class="colchart" style="--h:${o.h || 110}px" role="img" aria-label="${esc(o.label || '')}">
    <span class="cc-max">${esc(o.fmt ? o.fmt(max) : String(max))}</span>
    <div class="cc-plot">${data.map((d, i) => `<div class="cc-col ${d.cur ? 'cur' : ''}" title="${esc(d.tip)}"><i style="height:${d.v ? Math.max(3, d.v / max * 100) : 0}%"></i><span>${i % every === 0 || d.cur ? esc(d.label) : ''}</span></div>`).join('')}</div></div>`;
}
function heatmap(weeks) {
  const start = new Date(); start.setHours(12, 0, 0, 0); start.setDate(start.getDate() - start.getDay() - (weeks - 1) * 7);
  const cells = [], vals = [];
  for (let i = 0; i < weeks * 7; i++) { const d = new Date(start.getTime() + i * DAY), dk = dayKey(d.getTime()), future = d.getTime() > Date.now(); const m = future ? -1 : dayRec(dk).m; cells.push({dk, m, d}); if (m > 0) vals.push(m); }
  const lvl = m => m < 0 ? 'fut' : !m ? 'h0' : m < 15 ? 'h1' : m < 40 ? 'h2' : m < 90 ? 'h3' : 'h4';
  const months = [...Array(weeks)].map((_, w) => { const d = cells[w * 7].d; return d.getDate() <= 7 ? d.toLocaleDateString(undefined, {month:'short'}) : ''; });
  return `<div class="heat" style="--w:${weeks}"><div class="heat-m">${months.map(m => `<span>${m}</span>`).join('')}</div>
    <div class="heat-g">${cells.map(c => `<i class="${lvl(c.m)}" ${c.m >= 0 ? `title="${c.d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'})}: ${fmtMins(c.m)}"` : ''}></i>`).join('')}</div>
    <div class="heat-k"><span>Less</span>${['h0', 'h1', 'h2', 'h3', 'h4'].map(h => `<i class="${h}"></i>`).join('')}<span>More</span><span class="muted" style="margin-left:auto">${vals.length} days with study time</span></div></div>`;
}

const varsOf = q => (Array.isArray(q.vars) ? q.vars : str(q.vars).split(/[,\s]+/)).map(v => str(v).trim()).filter(v => /^[a-zA-Z]\w*$/.test(v));

  try {
    const g = await AI.json(prompt, {modelTier:'default', cache:false});
    if (TASK !== T) return;
    g.score = clamp01(g && g.score);
    T.result = g; T.stage = 'result';
    if (g.gap && g.gap.concept && g.score < 0.7) addGap(T.key, {concept:str(g.gap.concept), detail:str(g.gap.detail)});
    const n = ensureNode(T.key); n.last = Date.now(); if (!n.firstAt) n.firstAt = Date.now(); Store.saveNode(T.key);

  render();
}

      ${st.why ? `<p class="muted small"><b>Why:</b> ${esc(st.why)}</p>` : ''}
      <div class="checkpoint"><div class="eyebrow">Checkpoint</div>${check}
      ${P.msg ? `<div class="notice ${P.msgKind || ''}">${P.msg}</div>` : ''}
      ${P.photoBusy ? '<div class="thinking"><span class="pulse"></span>Checking your photo…</div>' : ''}
      ${P.fail ? `<div class="row"><button class="btn" data-act="projTrouble">Troubleshoot with the tutor</button><button class="btn ghost sm" data-act="projPass">Continue anyway</button></div>` : ''}</div>
    </section>`;
  }
  return `<div style="--c:${s.color}">${head}
    <header class="page-h" style="padding-top:4px"><div class="eyebrow">Project · ${esc(plan.time || '')}</div><h1>${esc(plan.title)}</h1><p class="muted">${esc(plan.goal || '')}</p></header>
    <details class="card" ${i === 0 && !done ? 'open' : ''}><summary><b>Parts, tools, and safety</b></summary>
      ${plan.parts.length ? `<div class="eyebrow" style="margin-top:10px">Parts</div><ul>${plan.parts.map(p => `<li><b>${esc(p.qty || '')} ${esc(p.name)}</b>${p.note ? ` · <span class="muted">${esc(p.note)}</span>` : ''}</li>`).join('')}</ul>` : ''}
      ${plan.tools.length ? `<div class="eyebrow">Tools</div><p>${plan.tools.map(esc).join(', ')}</p>` : ''}
      ${plan.safety.length ? `<div class="notice warn"><b>Safety</b><ul>${plan.safety.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    </details>
    <ol class="steps">${steps}</ol>
    ${cur}
  </div>`;
};
function projAdvance(passed) {
  const node = Store.nodes[PROJ.key], pj = node.proj;
  pj.passed[pj.step] = passed; pj.step++;
  PROJ.measure = ''; PROJ.observe = ''; PROJ.msg = ''; PROJ.fail = false; PROJ.no = false;
  if (pj.step >= pj.plan.steps.length) {
    pj.finished = true; pj.finishedAt = Date.now();
    const before = mastery(node);
    node.mastery = Math.max(node.mastery || 0, 70); node.last = Date.now(); node.sessions = (node.sessions || 0) + 1; schedule(node, 0.85);
    node.projects = (node.projects || 0) + 1;
    addXP(50); toast(`Project complete · mastery ${before}% → ${mastery(node)}%`);
  } else addXP(5);
  Store.saveNode(PROJ.key); render(); window.scrollTo(0, 0);
}
function projTrouble() {
  const node = Store.nodes[PROJ.key], pj = node.proj, st = pj.plan.steps[pj.step], info = nodeInfo(PROJ.key);
  const c = st.check;
  const detail = c.type === 'measure' ? `Expected about ${c.expect.value} ${c.expect.unit || ''}; I measured ${PROJ.measure || '?'} ${c.expect.unit || ''}.` : c.type === 'observe' ? `Expected: ${c.look_for || c.prompt}. What I see: ${PROJ.observe || 'it doesn’t work'}.` : (PROJ.photoText || '');
  addGap(PROJ.key, {concept:('Build: ' + st.title).slice(0, 60), detail:detail.slice(0, 300)});
  openTutor(info.sid, {send:`I'm building “${pj.plan.title}”, step ${pj.step + 1}: ${st.title}.\n\nStep instructions: ${st.body.slice(0, 900)}\n\nCheckpoint: ${c.prompt || c.look_for || ''}\n${detail}\n\nHelp me troubleshoot. What should I check first?`});
}
async function projectPhoto(file) {
  const P = PROJ; if (!P || !AI.ok()) return;
  const node = Store.nodes[P.key], st = node.proj.plan.steps[node.proj.step];
  P.photoBusy = true; P.msg = ''; render();
  try {
    const r = await AI.json(`A learner is building a project and photographed their work for a checkpoint.
Step: ${st.title}
Instructions: ${st.body.slice(0, 1500)}
What a correct build shows: ${st.check.look_for || st.check.prompt || ''}
Look at the photo. Judge whether this step is done correctly, being specific about orientation, placement, and connections you can see. If you can't tell from the photo, say what to photograph instead.
Reply with only JSON: {"pass":true or false,"feedback":"2-3 sentences","issues":["specific problems you can see"]}`, {images:file});
    if (PROJ !== P) return;
    P.photoBusy = false;
    if (r && r.pass) { toast('Checkpoint passed'); P.msg = ''; projAdvance(true); return; }
    P.photoText = str(r && r.feedback) + (Array.isArray(r && r.issues) && r.issues.length ? ' Issues: ' + r.issues.join('; ') : '');
    P.msg = esc(P.photoText); P.msgKind = 'bad'; P.fail = true;
  } catch (e) { if (PROJ !== P) return; P.photoBusy = false; P.msg = esc(errCopy(e)); P.msgKind = 'warn'; }
  render();
}
Object.assign(ACT, {
  project: a => { const [key, flag] = String(a).split('|'); openProject(key, flag === 'new'); },
  projMeasure: () => {
    const P = PROJ; const node = Store.nodes[P.key], c = node.proj.plan.steps[node.proj.step].check;
    const v = parseFloat(String(P.measure || '').replace(',', '.'));
    if (!isFinite(v)) { P.msg = 'Enter a number.'; P.msgKind = 'warn'; render(); return; }
    const want = Number(c.expect.value), tol = Math.max(Number(c.expect.tolerance) || 0.1, 0.02);
    if (Math.abs(v - want) <= Math.max(tol * Math.abs(want), 1e-9)) { toast('Checkpoint passed'); projAdvance(true); }
    else { P.msg = `Expected about ${want} ${esc(c.expect.unit || '')} (±${Math.round(tol * 100)}%); you measured ${v}. Something’s off: check the circuit against the step, then measure again.`; P.msgKind = 'bad'; P.fail = true; render(); }
  },
  projPass: () => projAdvance(true),
  projNo: () => { if (PROJ) { PROJ.no = true; render(); } },
  projTrouble: () => projTrouble()
});

/* ------------------------------------------------------------------ boot */
(async function boot() {
  const mjs = document.querySelector('script[src*="mathjs"]');
  const onMath = () => { MX.ok(); if (VIEW.name !== 'boot') { drawPlots(document.getElementById('app')); renderPreview(); } };
  if (window.math) onMath(); else if (mjs) mjs.addEventListener('load', onMath);
  try { if (window.speechSynthesis) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => {}; } } catch (e) {}
  await Promise.all([Store.init(), AI.init()]);
  try { migrateCurriculum(); } catch (e) { console.warn('migration', e); }
  applyTheme();
  try { habitTick(); } catch (e) { console.warn('habit', e); }
  setInterval(studyTick, 30000);
  window.addEventListener('pagehide', () => { try { Store.saveProfile(); } catch (e) {} });
  if ((Store.profile.webMode || 'current') !== 'off') { try { await WEB.init(false); } catch (e) {} }
  go('home');
})();

})();
</script>
